name: Bootstrap Tailscale client
on:
  push:
    paths:
      - '.github/workflows/bootstrap-tailscale-client.yml'
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download static Tailscale
        run: |
          curl -fsSL https://pkgs.tailscale.com/stable/tailscale_1.102.4_amd64.tgz -o tailscale_1.102.4_amd64.tgz
          sha256sum tailscale_1.102.4_amd64.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: tailscale-static-1.102.4-amd64
          path: tailscale_1.102.4_amd64.tgz
