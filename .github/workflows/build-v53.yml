name: Build Bambini v5.3 HLS warm start
on:
  push:
    paths:
      - 'android-v53/**'
      - '.github/workflows/build-v53.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bundle HLS runtime and starter media
        run: |
          mkdir -p android-v53/app/src/main/assets
          curl -fsSL http://169.58.183.182:18080/hls.min.js -o android-v53/app/src/main/assets/hls.min.js
          curl -fsSL http://169.58.183.182:18080/src/18714.mp4 -o android-v53/app/src/main/assets/starter.mp4
          curl -fsSL http://169.58.183.182:18080/hlsav/18714/poster.jpg -o android-v53/app/src/main/assets/starter.jpg
          test -s android-v53/app/src/main/assets/hls.min.js
          test -s android-v53/app/src/main/assets/starter.mp4
          test -s android-v53/app/src/main/assets/starter.jpg
      - name: Build
        working-directory: android-v53
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip
          ./gradle-8.14.3/bin/gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Bambini-Living-v5.3-HLS-warm-start.apk
      - name: Publish APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Bambini-Living-v5.3-HLS-warm-start.apk
          git commit -m "Publish Bambini Living v5.3 HLS warm-start APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Bambini-Living-v5.3-HLS-warm-start
          path: Bambini-Living-v5.3-HLS-warm-start.apk
