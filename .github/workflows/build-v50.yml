name: Build Bambini v5 HLS test
on:
  push:
    paths:
      - 'android-v50/**'
      - '.github/workflows/build-v50.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: android-v50
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip
          ./gradle-8.14.3/bin/gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Bambini-Living-v5-HLS-test.apk
      - name: Publish APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Bambini-Living-v5-HLS-test.apk
          git commit -m "Publish Bambini Living v5 HLS test APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Bambini-Living-v5-HLS-test
          path: Bambini-Living-v5-HLS-test.apk
