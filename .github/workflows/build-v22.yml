name: Build Bambini v2.2
on:
  push:
    paths:
      - 'android-v22/**'
      - '.github/workflows/build-v22.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        working-directory: android-v22
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip
          ./gradle-8.14.3/bin/gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Bambini-Living-v2.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Bambini-Living-v2.2
          path: Bambini-Living-v2.2.apk
