name: Apply Bambini original photos
on:
  push:
    paths:
      - '.github/workflows/apply-bambini-photo-originals.yml'
permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install temporary Tailscale client
        run: |
          set -euo pipefail
          curl -fsSL https://pkgs.tailscale.com/stable/tailscale_1.102.4_amd64.tgz -o /tmp/ts.tgz
          mkdir -p /tmp/ts
          tar -xzf /tmp/ts.tgz -C /tmp/ts --strip-components=1
          sudo nohup /tmp/ts/tailscaled \
            --tun=userspace-networking \
            --state=/tmp/tailscale.state \
            --socket=/tmp/tailscaled.sock \
            >/tmp/tailscaled.log 2>&1 &
          sleep 3
          nohup /tmp/ts/tailscale --socket=/tmp/tailscaled.sock up \
            --hostname=github-bambini-photo-patch \
            --accept-dns=false \
            >/tmp/tailscale-up.log 2>&1 &
          sleep 8
          cp /tmp/tailscale-up.log /tmp/tailscale-auth.txt
          echo "Temporary Tailscale login requested."

      - name: Publish one-time Tailscale authorization URL
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-auth-url
          path: /tmp/tailscale-auth.txt
          retention-days: 1

      - name: Wait for Tailscale authorization
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if /tmp/ts/tailscale --socket=/tmp/tailscaled.sock status --json 2>/dev/null | grep -q '"BackendState": "Running"'; then
              /tmp/ts/tailscale --socket=/tmp/tailscaled.sock status
              exit 0
            fi
            sleep 10
          done
          echo "Tailscale authorization timed out."
          cat /tmp/tailscale-up.log || true
          exit 1

      - name: Patch Bambini photo delivery on production VPS
        run: |
          set -euo pipefail
          /tmp/ts/tailscale --socket=/tmp/tailscaled.sock ssh root@100.76.34.91 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /root/tg_photo_archive
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          backup="/root/tg_photo_archive/backups/photo-original-first-$stamp"
          mkdir -p "$backup"
          cp -a bambini/routes/media.py "$backup/media.py"
          cp -a bambini/services/living_feed.py "$backup/living_feed.py"
          systemctl cat tg-photo-web.service > "$backup/tg-photo-web.service.txt"
          echo "BACKUP=$backup"

          .venv/bin/python - <<'PY'
          from pathlib import Path
          p=Path('bambini/routes/media.py')
          s=p.read_text()
          old='''@media_bp.route("/thumb/<int:media_id>")
          def thumb(media_id):
              row = _get_file_record(media_id)

              try:
                  path = _safe_path(row["thumb_file_path"])
              except Exception:
                  path = _safe_path(row["original_file_path"])

              return send_file(
          '''
          new='''@media_bp.route("/thumb/<int:media_id>")
          def thumb(media_id):
              row = _get_file_record(media_id)

              # Living fullscreen photos must use the archive original. These
              # Telegram-origin files are already bounded/small; serving a
              # thumbnail and stretching it to TV size visibly degrades quality.
              if row["media_type"] == "photo":
                  candidates = (row["original_file_path"], row["thumb_file_path"])
              else:
                  candidates = (row["thumb_file_path"], row["original_file_path"])

              path = None
              for candidate in candidates:
                  try:
                      path = _safe_path(candidate)
                      break
                  except Exception:
                      continue
              if path is None:
                  abort(404)

              return send_file(
          '''
          if old not in s:
              raise SystemExit('Expected thumb route block not found; refusing blind patch')
          p.write_text(s.replace(old,new,1))
          PY

          .venv/bin/python -m py_compile bambini/routes/media.py
          PYTHONPATH=. .venv/bin/python tests/test_living.py

          systemctl restart tg-photo-web.service
          for i in $(seq 1 30); do
            [ "$(systemctl is-active tg-photo-web.service)" = active ] && break
            sleep 1
          done
          test "$(systemctl is-active tg-photo-web.service)" = active

          .venv/bin/python - <<'PY'
          import hashlib, sqlite3, subprocess, os, json
          DB='data/archive.sqlite3'
          def sha(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''): h.update(b)
              return h.hexdigest()
          with sqlite3.connect(DB) as db:
              db.row_factory=sqlite3.Row
              photos=db.execute("""
                  SELECT id,original_file_path,thumb_file_path
                  FROM media_files
                  WHERE media_type='photo'
                    AND original_file_path IS NOT NULL AND trim(original_file_path)!=''
                    AND thumb_file_path IS NOT NULL AND trim(thumb_file_path)!=''
                  ORDER BY id DESC LIMIT 3
              """).fetchall()
              video=db.execute("""
                  SELECT id,poster_file_path FROM media_files
                  WHERE media_type='video' AND poster_file_path IS NOT NULL
                    AND trim(poster_file_path)!=''
                  ORDER BY id DESC LIMIT 1
              """).fetchone()
          proof=[]
          for r in photos:
              out=f'/tmp/bambini-photo-{r["id"]}.bin'
              subprocess.run(['curl','-fsS','http://127.0.0.1:8091/thumb/'+str(r['id']),'-o',out],check=True)
              proof.append({
                  'id':r['id'],
                  'response_matches_original':sha(out)==sha(r['original_file_path']),
                  'response_matches_thumb':sha(out)==sha(r['thumb_file_path']),
                  'original_bytes':os.path.getsize(r['original_file_path']),
                  'thumb_bytes':os.path.getsize(r['thumb_file_path']),
                  'response_bytes':os.path.getsize(out),
              })
          print('PHOTO_PROOF='+json.dumps(proof))
          if not proof or not all(x['response_matches_original'] for x in proof):
              raise SystemExit('photo original-first smoke proof failed')
          if video:
              out=f'/tmp/bambini-poster-{video["id"]}.bin'
              subprocess.run(['curl','-fsS','http://127.0.0.1:8091/poster/'+str(video['id']),'-o',out],check=True)
              ok=sha(out)==sha(video['poster_file_path'])
              print('VIDEO_POSTER_UNCHANGED='+json.dumps({'id':video['id'],'matches_poster':ok}))
              if not ok: raise SystemExit('video poster behavior changed')
          PY

          echo "SERVICES:"
          for u in tg-photo-web.service tg-photo-live-listener.service tg-photo-health-loop.service tg-photo-living-hls.timer tg-photo-remux.timer; do
            printf '%s=' "$u"
            systemctl is-active "$u" || true
          done

          .venv/bin/python - <<'PY'
          from pathlib import Path
          listener=Path('live_listener.py').read_text()
          remux=Path('remux_videos.py').read_text()
          hls=Path('bambini/services/living_hls_autobuild.py').read_text()
          assert 'download_media_if_needed' in listener
          assert 'hls_ids' in remux and 'build_and_record' in remux
          assert 'def run_once' in hls
          print('INGEST_PIPELINE_VERIFIED=listener+remux+hls-autobuild')
          PY

          echo "PATCH_OK"
          REMOTE
