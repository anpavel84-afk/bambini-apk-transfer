name: Build Bambini v3 native
on:
  push:
    paths:
      - 'android-v30/**'
      - '.github/workflows/build-v30.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore native source
        working-directory: android-v30
        run: |
          mkdir -p app/src/main/java/ru/anpavel/bambiniliving
          base64 -d MainActivity.java.gz.b64 | gzip -dc > app/src/main/java/ru/anpavel/bambiniliving/MainActivity.java
      - name: Build
        working-directory: android-v30
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip
          ./gradle-8.14.3/bin/gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Bambini-Living-v3-native.apk
      - name: Publish APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Bambini-Living-v3-native.apk
          git commit -m "Publish Bambini Living v3 native APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Bambini-Living-v3-native
          path: Bambini-Living-v3-native.apk
