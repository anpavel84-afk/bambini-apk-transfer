name: Build Bambini v5.4 persistent cache test
on:
  push:
    paths:
      - 'android-v54/**'
      - '.github/workflows/build-v54.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bundle HLS runtime
        run: |
          mkdir -p android-v54/app/src/main/assets
          curl -fsSL https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js -o android-v54/app/src/main/assets/hls.min.js
          test -s android-v54/app/src/main/assets/hls.min.js
      - name: Build
        working-directory: android-v54
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip
          ./gradle-8.14.3/bin/gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Bambini-Living-v5.4-persistent-cache-test.apk
      - name: Publish APK
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Bambini-Living-v5.4-persistent-cache-test.apk
          git commit -m "Publish Bambini Living v5.4 persistent-cache test APK" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Bambini-Living-v5.4-persistent-cache-test
          path: Bambini-Living-v5.4-persistent-cache-test.apk
